spring:
  application:
    name: logimatch-backend
  datasource:
    url: jdbc:h2:mem:logimatchdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    secret: "bG9naW1hdGNoLXN1cGVyLXNlY3JldC1rZXktMjAyNi1tdXN0LWJlLWF0LWxlYXN0LTI1Ni1iaXRzLWxvbmc="
    expiration: 86400000

logging:
  level:
    com.logimatch: INFO
